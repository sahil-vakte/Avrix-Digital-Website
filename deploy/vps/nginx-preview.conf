# Temporary preview while the owner prepares DNS. Admin/API stay private.
server {
    listen 8081 default_server;
    listen [::]:8081 default_server;
    server_name _;
    root /opt/avrix-website/current/frontend/dist;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    location ~ ^/(api|manage-7f3k|admin-setup|static)(/|$) { return 503; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
