# Bootstrap HTTP site. Replace with nginx-https.conf after DNS and TLS are ready.
# Install as /etc/nginx/sites-available/avrixdigital.co.uk, then enable that site.
server {
    listen 80;
    listen [::]:80;
    server_name avrixdigital.co.uk www.avrixdigital.co.uk;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/avrix-website/shared/acme;
        try_files $uri =404;
    }

    # Do not expose the admin or accept form submissions before HTTPS is ready.
    location / { return 503; }
}
