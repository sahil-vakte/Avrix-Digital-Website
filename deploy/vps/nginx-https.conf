server {
    listen 80;
    listen [::]:80;
    server_name avrixdigital.co.uk www.avrixdigital.co.uk;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/avrix-website/shared/acme;
        try_files $uri =404;
    }
    location / { return 301 https://avrixdigital.co.uk$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.avrixdigital.co.uk;
    ssl_certificate /etc/letsencrypt/live/avrixdigital.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avrixdigital.co.uk/privkey.pem;
    return 301 https://avrixdigital.co.uk$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name avrixdigital.co.uk;
    ssl_certificate /etc/letsencrypt/live/avrixdigital.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avrixdigital.co.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/avrix-website/current/frontend/dist;
    index index.html;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ ^/(api|manage-7f3k|admin-setup|static)(/|$) {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 50s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
