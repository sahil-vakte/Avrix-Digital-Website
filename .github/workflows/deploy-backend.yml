name: Deploy backend
on:
  push:
    branches: [main]
    paths: ['backend/**', 'deploy/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: backend-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.ENABLE_LEGACY_VPS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r backend/requirements.lock.txt
      - run: ruff check . && pytest
        working-directory: backend
      - name: Set image
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/avrix-api" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
      - uses: appleboy/ssh-action@v1.2.0
        env:
          NEW_IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: NEW_IMAGE,COMMIT_SHA
          script: |
            set -eu
            cd /opt/avrix-website
            git fetch origin main
            git checkout --detach "$COMMIT_SHA"
            bash deploy/rollout.sh "$NEW_IMAGE"
