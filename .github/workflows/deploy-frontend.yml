name: Deploy frontend
on:
  push:
    branches: [main]
    paths: ['frontend/**', 'content/**', '.github/workflows/deploy-frontend.yml']
  pull_request:
    paths: ['frontend/**', 'content/**']
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    if: vars.ENABLE_LEGACY_PAGES_DEPLOY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run lint && npm run typecheck && npm test && npm run build && npm run seo:check
        working-directory: frontend
        env:
          VITE_SITE_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_GA4_ID: ${{ vars.VITE_GA4_ID }}
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}
      - name: Deploy Pages
        id: pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          wranglerVersion: '3.114.1'
          command: pages deploy dist --project-name=avrix-website --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.pages.outputs.deployment-url }}
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`AVRIX preview (noindex): ${process.env.PREVIEW_URL}`});
