name: Scheduled production checks
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  monitor:
    if: vars.ENABLE_PRODUCTION_MONITORING == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npx lhci autorun --collect.staticDistDir= --collect.url=https://avrixdigital.co.uk/ --collect.url=https://avrixdigital.co.uk/services/ --collect.url=https://avrixdigital.co.uk/contact-us/
        working-directory: frontend
      - run: npx linkinator https://avrixdigital.co.uk --recurse --timeout 20000
        working-directory: frontend
      - if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title:'Production website check failed',body:`Review the scheduled run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
