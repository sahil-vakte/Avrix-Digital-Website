<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Abstract gradient glow">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#FFFFFF" fill-opacity=".09"/></pattern>
    <radialGradient id="fade" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#07080C" stop-opacity="1"/></radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="#07080C"/>
  <g filter="url(#blur)">
    <ellipse cx="1120" cy="340" rx="360" ry="260" fill="#fd3f00" fill-opacity=".55"/>
    <ellipse cx="1330" cy="620" rx="300" ry="220" fill="#ff936f" fill-opacity=".35"/>
    <ellipse cx="900" cy="700" rx="220" ry="160" fill="#fd3f00" fill-opacity=".18"/>
  </g>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#fade)"/>
</svg>
